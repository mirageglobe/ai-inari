version: 2

project_name: inari

before:
  hooks:
    - go mod tidy

builds:
  - id: inari
    # the package dir, not main.go: cmd/inari is multi-file (main/chat/daemon/doctor/
    # process/paths/tui), so building the single file fails to resolve sibling symbols.
    main: ./cmd/inari
    binary: inari
    ldflags:
      - -s -w -X github.com/mirageglobe/inari/internal/version.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: arm64

archives:
  - id: inari
    formats:
      - tar.gz
    name_template: "inari_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE.md

checksum:
  name_template: "inari_{{ .Version }}_checksums.txt"
  algorithm: sha256

release:
  github:
    owner: mirageglobe
    name: inari
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"

# no homebrew automation here (the "scout way", matching mirageglobe/scout):
# goreleaser only builds binaries and publishes the github release; the tap formula
# Formula/inari.rb is hand-maintained in mirageglobe/homebrew-tap. this keeps
# release.yml on the built-in GITHUB_TOKEN with no cross-repo PAT. after each release,
# update the tap formula's version + per-arch url + sha256 (from the release
# checksums) so `brew install mirageglobe/tap/inari` picks up the new build.
