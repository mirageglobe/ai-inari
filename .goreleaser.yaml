version: 2

project_name: inari

before:
  hooks:
    - go mod tidy

builds:
  - id: inari
    # the package dir, not main.go: cmd/inari is multi-file (main/chat/daemon/doctor/
    # process/paths/tui), so building the single file fails to resolve sibling symbols.
    main: ./cmd/inari
    binary: inari
    ldflags:
      - -s -w -X github.com/mirageglobe/ai-inari/internal/version.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: arm64

archives:
  - id: inari
    formats:
      - tar.gz
    name_template: "inari_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE.md

checksum:
  name_template: "inari_{{ .Version }}_checksums.txt"
  algorithm: sha256

release:
  github:
    owner: mirageglobe
    name: ai-inari
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"

# publish a homebrew formula to mirageglobe/homebrew-tap on each release so inari
# installs via `brew install mirageglobe/tap/inari`. formula (not cask) to match the
# existing tap convention (Formula/scout.rb) and support linux brew; it overwrites
# the stale hand-written Formula/inari.rb on release. goreleaser 2.17 flags `brews`
# as deprecated but still generates the formula on `release`. the tap-push token is a
# PAT/deploy key with write access to the tap repo (HOMEBREW_TAP_GITHUB_TOKEN); the
# default GITHUB_TOKEN cannot push to another repo.
brews:
  - name: inari
    repository:
      owner: mirageglobe
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/mirageglobe/ai-inari"
    description: "keyboard-driven TUI for chatting with local LLMs via Ollama"
    license: "BUSL-1.1"
    install: |
      bin.install "inari"
    test: |
      system "#{bin}/inari", "version"
